name: release
# Builds standalone PyRecorder bundles for all three platforms.
# - workflow_dispatch: artifacts only (CI smoke of the packaging itself)
# - tag push (v*): artifacts attached to a GitHub release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    name: bundle / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: PyRecorder-macOS
          - os: windows-latest
            artifact: PyRecorder-Windows
          - os: ubuntu-latest
            artifact: PyRecorder-Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ffmpeg-binary]" pyinstaller
      - name: Build bundle
        run: pyinstaller packaging/pyinstaller.spec --noconfirm
      - name: Package (macOS .app)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent PyRecorder.app "${{ matrix.artifact }}.zip"
      - name: Package (Windows / Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cd dist
          mv PyRecorder "${{ matrix.artifact }}${{ runner.os == 'Windows' && '.exe' || '' }}"
          tar -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.*
  release:
    name: attach bundles to the tagged release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
