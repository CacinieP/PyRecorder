name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libraries
        # PyQt6 needs EGL/GL/xkbcommon at runtime (tests run with the offscreen
        # platform plugin); portaudio lets pyaudio build from its sdist; ffmpeg
        # (+ffprobe) is used to build real fixtures for the moviepy merge and
        # mp4-trailer tests — without it those 4 tests silently skip.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 portaudio19-dev ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest flake8
          python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Lint with flake8
        run: |
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
