name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
            requirements: requirements.txt
          - os: ubuntu-latest
            python-version: '3.12'
            requirements: requirements.txt
          - os: windows-latest
            python-version: '3.12'
            requirements: requirements.txt
          - os: macos-latest
            python-version: '3.12'
            requirements: requirements-mac.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libraries
        if: runner.os == 'Linux'
        # PyQt6 needs EGL/GL/xkbcommon at runtime (tests run with the offscreen
        # platform plugin); portaudio lets pyaudio build from its sdist; ffmpeg
        # (+ffprobe) is used to build and inspect real media fixtures.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 portaudio19-dev ffmpeg
      - name: Install macOS media tools
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
      - name: Install Windows media tools
        if: runner.os == 'Windows'
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Require real media test tools
        # Fail early instead of silently skipping media tests on any platform.
        shell: python
        run: |
          import shutil
          import subprocess
          for name in ("ffmpeg", "ffprobe"):
              executable = shutil.which(name)
              if executable is None:
                  raise SystemExit(f"Missing required media test tool: {name}")
              subprocess.run([executable, "-version"], check=True)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ${{ matrix.requirements }} -r requirements-test.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Lint with flake8
        run: |
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
