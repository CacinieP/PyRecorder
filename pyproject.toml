[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pyrecorder"
version = "3.0.0"
description = "A minimal screen + face + voice recorder for teaching videos (screen, camera bubble, microphone — one MP4, one ffmpeg process)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "PyRecorder contributors" }]
requires-python = ">=3.11"
keywords = ["screen-recording", "screencast", "teaching-video", "picture-in-picture", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    # PyQt6 6.6.x metadata does not bound PyQt6-Qt6, so a fresh install pairs
    # the 6.6 wrapper with Qt 6.11 and crashes on import (see
    # docs/known-issues.md); 6.7.0+ pins both to the same minor.
    "PyQt6>=6.7,<7",
    "opencv-python>=4.8",
    "numpy>=1.26",
    # screen capture for the Windows/Linux feeders (the unified runtime
    # dependency; the legacy extra used to be the only place it lived)
    "mss>=9",
]

[project.optional-dependencies]
# Ships a private static ffmpeg binary — the zero-system-setup option.
ffmpeg-binary = ["imageio-ffmpeg"]
# The frozen legacy editions (legacy/) still use the old two-step pipeline.
# (mss comes from the base dependencies now.)
legacy = ["pyaudio==0.2.14", "moviepy>=2.0", "Pillow>=10.2"]
dev = ["pytest>=8,<10", "flake8>=7,<8"]

[project.scripts]
pyrecorder = "pyrecorder.ui.app:main"

[project.urls]
Homepage = "https://github.com/CacinieP/PyRecorder"
Documentation = "https://github.com/CacinieP/PyRecorder/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["pyrecorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
